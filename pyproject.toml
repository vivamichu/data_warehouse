[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dset"
version = "0.1.0"
description = "Package manager for ML datasets — one line to load any dataset, anywhere."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "machine-learning",
    "datasets",
    "computer-vision",
    "segmentation",
    "classification",
    "data-loader",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.65",
    "Pillow>=9.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
hf = ["datasets>=2.14"]
kaggle = ["kaggle>=1.6"]
all = ["torch>=2.0", "datasets>=2.14", "kaggle>=1.6"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/vivamichu/data_warehouse"
Issues = "https://github.com/vivamichu/data_warehouse/issues"
Documentation = "https://github.com/vivamichu/data_warehouse#readme"

[project.scripts]
dset = "dset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dset = ["manifests/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
